help.title=Help
help.page=Help page
help.header=Quick guide
help.content=Use Ctrl+N for a new candidate, Ctrl+S to save, Delete to remove, F5 to refresh and F1 for help. In search fields, press Enter to search. Change the language from the Language menu in the navbar.
help.main.description=This system is used to register candidates and track trainings, payments and certification. Data is stored in MySQL and displayed in TableView controls.
help.systemUsage=How to use the system
help.candidatePane=1. Candidate registration
help.candidateText=Fill in the Candidates form with name, email, training, status and payment data. The Save button stores the candidate in the database.
help.paymentsPane=2. Payments
help.paymentsText=The Payments page registers the paid amount, payment method and refreshes remaining balances.
help.certificatesPane=3. Certificates
help.certificatesText=After training completion and payment, a candidate can receive a certificate with a unique number.
help.shortcutsPane=4. Shortcuts
help.localizationPane=5. Localization
help.localizationText=The Language menu in the navbar changes the application between Albanian, English and German.
about.title=About
about.content=JavaFX project for Human Computer Interaction. Includes UI/UX, accessibility, localization, database, TableView, dashboard and integrated help.
